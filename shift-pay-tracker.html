<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1E2230">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Track shifts, pay, bills and spending.">
<title>Shift Pay Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F2F7; --card: #FFFFFF; --card2: #F2F0F7; --card3: #E4E1EC; --card4: #E9E6F0;
    --line: #F0EEF4; --text: #1E2230; --mut: #7A8095; --mut2: #8A90A3; --dim: #9AA0B2;
    --dim2: #A9AEBE; --faint: #C2C6D2; --accent: #F73F5C; --accentHi: #E22B49; --onAccent: #FFFFFF;
    --clay: #E8503A; --sheet: #F7F6FA; --sheetLine: #EDEAF2; --grab: #D8D5E0; --circle: #CFCCD8;
    --todayBg: #FFF1F4; --todayBorder: #FFC8D2; --dangerBg: #FDECE8; --dangerBgHi: #FADCD5;
    --overlay: rgba(30,34,48,.42); --tabBg: #1E2230; --navy: #1E2230;
    --sh: 0 8px 24px rgba(30,34,48,.07);
  }
  html[data-theme="dark"] {
    --bg: #14161E; --card: #1E2130; --card2: #272B3B; --card3: #343949; --card4: #2E3344;
    --line: #262A38; --text: #F4F5F8; --mut: #949AAC; --mut2: #8A90A3; --dim: #7C8296;
    --dim2: #6C7286; --faint: #565C6E; --accent: #FF5A75; --accentHi: #FF7B90; --onAccent: #FFFFFF;
    --clay: #FF8A5C; --sheet: #1B1E2A; --sheetLine: #2A2E3D; --grab: #3A3F4E; --circle: #454A59;
    --todayBg: #2B1A22; --todayBorder: #5C2E3D; --dangerBg: #2E1C18; --dangerBgHi: #3E2620;
    --overlay: rgba(8,9,14,.7); --tabBg: #232735; --navy: #232735;
    --sh: 0 8px 24px rgba(0,0,0,.28);
  }
  @media (prefers-color-scheme: dark) {
    html[data-theme="auto"] {
      --bg: #14161E; --card: #1E2130; --card2: #272B3B; --card3: #343949; --card4: #2E3344;
      --line: #262A38; --text: #F4F5F8; --mut: #949AAC; --mut2: #8A90A3; --dim: #7C8296;
      --dim2: #6C7286; --faint: #565C6E; --accent: #FF5A75; --accentHi: #FF7B90; --onAccent: #FFFFFF;
      --clay: #FF8A5C; --sheet: #1B1E2A; --sheetLine: #2A2E3D; --grab: #3A3F4E; --circle: #454A59;
      --todayBg: #2B1A22; --todayBorder: #5C2E3D; --dangerBg: #2E1C18; --dangerBgHi: #3E2620;
      --overlay: rgba(8,9,14,.7); --tabBg: #232735; --navy: #232735;
      --sh: 0 8px 24px rgba(0,0,0,.28);
    }
  }
  html, body { margin: 0; padding: 0; background: var(--bg, #F4F2F7); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: var(--accent, #F73F5C); text-decoration: none; }
  a:hover { color: #E22B49; }
  button { font-family: inherit; cursor: pointer; border: 0; }
  input, select { font-family: inherit; }
  input[type="time"]::-webkit-calendar-picker-indicator { opacity: .45; }
  html[data-theme="dark"] input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .5; }
  @media (prefers-color-scheme: dark) {
    html[data-theme="auto"] input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .5; }
  }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ---------- constants ---------- */
var LS_KEY = 'shift-pay-tracker-v1';
var PA = 12570, BASIC = 50270, HIGHER = 125140;
var wPA = PA / 52, wBASIC = BASIC / 52, wHIGHER = HIGHER / 52;
var NI_PT = 242, NI_UEL = 967;
var JC = ['#F9506B', '#3D87F5', '#FB8C4B', '#8B7CF6', '#FBC93F'];
var CATS = [
  { name: 'Rent', color: '#3D87F5' },
  { name: 'Bills', color: '#8B7CF6' },
  { name: 'Food', color: '#FBC93F' },
  { name: 'Travel', color: '#FB8C4B' },
  { name: 'Going out', color: '#F9506B' },
  { name: 'Other', color: '#9AA0B2' }
];
var CYCLE_LABEL = { weekly: 'every Friday', fortnightly: 'every 2 weeks', fourweekly: 'every 4 weeks', monthly: 'monthly', custom: 'custom cycle' };
var DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
var SHOW_PENNIES = true;
var ROUND_QUARTER = false;
var DEFAULT_BREAK_MINS = 30;

/* ---------- utils ---------- */
var pad = function (n) { return String(n).padStart(2, '0'); };
var dateKey = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
var parseKey = function (k) { var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
var addDays = function (d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; };
var monday = function (d) { var x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
var mKey = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
var uid = function () { return Math.random().toString(36).slice(2, 9); };
var catColor = function (n) { return (CATS.find(function (c) { return c.name === n; }) || CATS[5]).color; };
var ord = function (n) { return (n % 10 === 1 && n !== 11) ? 'st' : (n % 10 === 2 && n !== 12) ? 'nd' : (n % 10 === 3 && n !== 13) ? 'rd' : 'th'; };
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function money(n, dp) {
  var p = dp === undefined ? (SHOW_PENNIES ? 2 : 0) : dp;
  return '\u00a3' + Math.abs(n).toLocaleString('en-GB', { minimumFractionDigits: p, maximumFractionDigits: p });
}
function hrs(n) {
  var h = n;
  if (ROUND_QUARTER) h = Math.round(h * 4) / 4;
  return (Math.round(h * 100) / 100).toFixed(h % 1 === 0 ? 0 : (h * 10 % 1 === 0 ? 1 : 2)) + 'h';
}

function blank() {
  return { user: { name: '' }, jobs: [], shifts: [], bills: [], spends: [], paid: {}, flat: false, flatPct: 20, theme: 'auto', pin: null, setup: false };
}
function loadData() {
  var data = null;
  try { var r = localStorage.getItem(LS_KEY); if (r) data = JSON.parse(r); } catch (e) {}
  if (!data || !data.jobs) data = blank();
  var OLDJC = { '#3FAE84': JC[0], '#D9A93F': JC[1], '#6E9BD1': JC[2], '#B98BD1': JC[3], '#CE7A56': JC[4] };
  data.jobs.forEach(function (j, i) { j.color = OLDJC[j.color] || j.color || JC[i % JC.length]; });
  return data;
}
function saveData() { try { localStorage.setItem(LS_KEY, JSON.stringify(D)); } catch (e) {} }

/* ---------- state ---------- */
var D = loadData();
var unlockedInitially = !D.pin;
try { if (sessionStorage.getItem(LS_KEY + '-open') === '1') unlockedInitially = true; } catch (e) {}

var UI = {
  unlocked: unlockedInitially,
  entry: '',
  pinEdit: '',
  confirmWipe: false,
  confirmJob: null,
  su: { name: '', j1n: '', j1r: '', j1c: 'weekly', j1t: 'hour', j2t: 'hour', j2on: false, j2n: '', j2r: '', j2c: 'weekly', pin: '', pin2: '' },
  suError: '',
  tab: 'home',
  weekOffset: 0,
  calOffset: 0,
  selDay: null,
  chart: 'cat',
  sheet: null,
  form: {},
  icsMsg: '',
  drag: 0,
  dragging: false
};

function setUI(patch) {
  var p = typeof patch === 'function' ? patch(UI) : patch;
  Object.assign(UI, p);
  render();
}
function setD(fn) {
  D = fn(JSON.parse(JSON.stringify(D)));
  saveData();
  render();
}
function suSet(k, v) { setUI(function (s) { var next = Object.assign({}, s.su); next[k] = v; return { su: next, suError: '' }; }); }

function applyTheme() {
  var t = D.theme || 'auto';
  if (document.documentElement.getAttribute('data-theme') !== t) document.documentElement.setAttribute('data-theme', t);
}

function finishSetup() {
  var s = UI.su;
  var r1 = Number(s.j1r);
  if (!s.j1n.trim() || !r1) { setUI({ suError: 'Give your first job a name and a rate.' }); return; }
  if (s.j2on && (!s.j2n.trim() || !Number(s.j2r))) { setUI({ suError: 'Fill in the second job, or remove it.' }); return; }
  if (s.pin && (s.pin.length !== 4 || s.pin !== s.pin2)) { setUI({ suError: 'The two codes need to match and be 4 digits.' }); return; }
  var jobs = [{ id: uid(), name: s.j1n.trim(), rate: r1, payType: s.j1t || 'hour', cycle: s.j1c, color: JC[0], taxMode: 'paye', taxPct: 20, cutoffDays: 0 }];
  if (s.j2on) jobs.push({ id: uid(), name: s.j2n.trim(), rate: Number(s.j2r), payType: s.j2t || 'hour', cycle: s.j2c, color: JC[1], taxMode: 'paye', taxPct: 20, cutoffDays: 0 });
  D = Object.assign({}, D, { user: { name: s.name.trim() }, jobs: jobs, pin: s.pin || null, setup: true });
  saveData();
  UI.unlocked = true;
  try { sessionStorage.setItem(LS_KEY + '-open', '1'); } catch (e) {}
  render();
}

function tapPin(n) {
  var e = (UI.entry + n).slice(0, 4);
  if (e.length === 4) {
    if (e === D.pin) { try { sessionStorage.setItem(LS_KEY + '-open', '1'); } catch (er) {} setUI({ entry: '', unlocked: true }); }
    else setUI({ entry: '', suError: 'Wrong code' });
  } else {
    setUI({ entry: e, suError: '' });
  }
}
function backspacePin() { setUI(function (s) { return { entry: s.entry.slice(0, -1) }; }); }

function addJobFn() {
  setD(function (x) {
    x.jobs = x.jobs.concat([{ id: uid(), name: 'New job', rate: 0, cycle: 'weekly', color: JC[x.jobs.length % JC.length], taxMode: 'paye', taxPct: 20, cutoffDays: 0 }]);
    return x;
  });
}
function removeJobFn(id) {
  setD(function (x) { x.jobs = x.jobs.filter(function (j) { return j.id !== id; }); x.shifts = x.shifts.filter(function (s) { return s.jobId !== id; }); return x; });
  setUI({ confirmJob: null });
}
function wipeFn() {
  D = blank();
  saveData();
  try { sessionStorage.removeItem(LS_KEY + '-open'); } catch (e) {}
  UI = Object.assign({}, UI, {
    unlocked: true, entry: '', confirmWipe: false, tab: 'home', sheet: null,
    su: { name: '', j1n: '', j1r: '', j1c: 'weekly', j1t: 'hour', j2t: 'hour', j2on: false, j2n: '', j2r: '', j2c: 'weekly', pin: '', pin2: '' }
  });
  render();
}

function jobById(id) { return D.jobs.find(function (j) { return j.id === id; }) || D.jobs[0]; }
function shiftHoursFn(s) {
  var a = s.start.split(':').map(Number), b = s.end.split(':').map(Number);
  var m = (b[0] * 60 + b[1]) - (a[0] * 60 + a[1]);
  if (m <= 0) m += 1440;
  m -= (s.brk || 0);
  var h = Math.max(0, m / 60);
  if (ROUND_QUARTER) h = Math.round(h * 4) / 4;
  return h;
}
function nextPayday(j, today) {
  var cycle = j.cycle || 'monthly';
  var anchor = j.payAnchor ? parseKey(j.payAnchor) : null;
  var step = cycle === 'fortnightly' ? 14 : cycle === 'fourweekly' ? 28 : Math.max(1, Number(j.customDays) || 28);
  for (var i = 0; i < 80; i++) {
    var dt = addDays(today, i);
    var din = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
    var hit = false;
    if (cycle === 'weekly') hit = dt.getDay() === 5;
    else if (cycle === 'monthly') hit = dt.getDate() === Math.min(Number(j.payDay) || 28, din);
    else if (anchor) {
      var diff = Math.round((dt - anchor) / 86400000);
      hit = ((diff % step) + step) % step === 0;
    }
    if (hit) return { i: i, dt: dt };
  }
  return null;
}
function shiftGrossFn(s, j) {
  var jb = j || jobById(s.jobId);
  return (jb.payType === 'day') ? (Number(jb.rate) || 0) : shiftHoursFn(s) * jb.rate;
}
function grossByJob(shifts) {
  var out = {};
  D.jobs.forEach(function (j) { out[j.id] = { hours: 0, gross: 0 }; });
  shifts.forEach(function (s) {
    var j = jobById(s.jobId); if (!out[j.id]) out[j.id] = { hours: 0, gross: 0 };
    var h = shiftHoursFn(s);
    out[j.id].hours += h; out[j.id].gross += shiftGrossFn(s, j);
  });
  return out;
}
function deductWeek(byJob) {
  var grosses = Object.keys(byJob).map(function (k) { return byJob[k].gross; });
  var g = grosses.reduce(function (a, b) { return a + b; }, 0);
  if (D.flat) {
    var t = g * (Math.max(0, Math.min(100, Number(D.flatPct) || 0)) / 100);
    return { gross: g, tax: t, ni: 0, net: g - t };
  }
  var it = 0, ni = 0;
  var paye = [];
  Object.keys(byJob).forEach(function (k) {
    var j = jobById(k), gr = byJob[k].gross, mode = (j && j.taxMode) || 'paye';
    if (mode === 'none' || gr <= 0) return;
    if (mode === 'flat') { it += gr * (Math.max(0, Math.min(100, Number(j.taxPct) || 0)) / 100); return; }
    paye.push(gr);
  });
  var pg = paye.reduce(function (a, b) { return a + b; }, 0);
  if (pg > wPA) {
    it += Math.min(pg - wPA, wBASIC - wPA) * 0.2;
    if (pg > wBASIC) it += Math.min(pg - wBASIC, wHIGHER - wBASIC) * 0.4;
    if (pg > wHIGHER) it += (pg - wHIGHER) * 0.45;
  }
  paye.forEach(function (x) {
    if (x > NI_PT) ni += (Math.min(x, NI_UEL) - NI_PT) * 0.08;
    if (x > NI_UEL) ni += (x - NI_UEL) * 0.02;
  });
  return { gross: g, tax: it, ni: ni, net: g - it - ni };
}
function weekShifts(mon) {
  var a = dateKey(mon), b = dateKey(addDays(mon, 6));
  return D.shifts.filter(function (s) { return s.date >= a && s.date <= b; });
}
function monthNetFn(monthKey) {
  var weeks = {};
  D.shifts.forEach(function (s) { var w = dateKey(monday(parseKey(s.date))); (weeks[w] = weeks[w] || []).push(s); });
  var gross = 0, tax = 0, hours = 0;
  Object.keys(weeks).forEach(function (w) {
    var list = weeks[w];
    var tot = deductWeek(grossByJob(list));
    if (tot.gross <= 0) return;
    var rate = tot.tax / tot.gross + (tot.ni || 0) / tot.gross;
    list.forEach(function (s) {
      if (s.date.slice(0, 7) !== monthKey) return;
      var j = jobById(s.jobId), h = shiftHoursFn(s), g = shiftGrossFn(s, j);
      gross += g; hours += h; tax += g * rate;
    });
  });
  return { gross: gross, tax: tax, net: gross - tax, hours: hours };
}
function billsFor(monthDate, today) {
  var daysIn = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0).getDate();
  var isCur = monthDate.getFullYear() === today.getFullYear() && monthDate.getMonth() === today.getMonth();
  return D.bills.filter(function (b) { return !isCur || Math.min(b.day, daysIn) <= today.getDate(); });
}
function openShiftSheet(dateK, shift) {
  var j0 = D.jobs[0] || { id: '' };
  setUI({
    sheet: 'shift',
    form: shift
      ? { id: shift.id, date: shift.date, jobId: shift.jobId, start: shift.start, end: shift.end, brk: shift.brk || 0 }
      : { date: dateK, jobId: j0.id, start: '09:00', end: '17:00', brk: DEFAULT_BREAK_MINS }
  });
}

/* ---------- ICS export ---------- */
function icsDay(dt) { return dt.getFullYear() + pad(dt.getMonth() + 1) + pad(dt.getDate()); }
function icsEsc(t) { return String(t).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
function buildIcs() {
  var d = D;
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  var lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Shift Pay Tracker//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Bills & paydays'];
  var n = 0;
  var ev = function (id, dt, summary, desc, alarm) {
    n++;
    lines.push('BEGIN:VEVENT', 'UID:' + id + '@shiftpaytracker', 'DTSTAMP:' + stamp,
      'DTSTART;VALUE=DATE:' + icsDay(dt), 'DTEND;VALUE=DATE:' + icsDay(addDays(dt, 1)),
      'SUMMARY:' + icsEsc(summary), 'DESCRIPTION:' + icsEsc(desc), 'TRANSP:TRANSPARENT',
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'TRIGGER:-PT15H', 'DESCRIPTION:' + icsEsc(alarm), 'END:VALARM', 'END:VEVENT');
  };
  for (var m = 0; m < 6; m++) {
    var base = new Date(today.getFullYear(), today.getMonth() + m, 1);
    var din = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
    (d.bills || []).forEach(function (b) {
      var dt = new Date(base.getFullYear(), base.getMonth(), Math.min(Number(b.day) || 1, din));
      if (dt < today) return;
      var amt = money(b.amount, 0);
      ev('bill-' + b.id + '-' + icsDay(dt), dt, b.name + ' ' + amt + ' due', b.cat + ' \u00b7 from your pay tracker', b.name + ' ' + amt + ' leaves tomorrow');
    });
  }
  var limit = addDays(today, 184);
  (d.jobs || []).forEach(function (j) {
    var cursor = today;
    for (var k = 0; k < 30; k++) {
      var p = nextPayday(j, cursor);
      if (!p || p.dt > limit) break;
      ev('pay-' + j.id + '-' + icsDay(p.dt), p.dt, j.name + ' payday', 'Pay expected from ' + j.name, j.name + ' payday tomorrow');
      cursor = addDays(p.dt, 1);
    }
  });
  lines.push('END:VCALENDAR');
  return { text: lines.join('\r\n'), count: n };
}
function exportIcsFn() {
  var built = buildIcs();
  if (!built.count) { setUI({ icsMsg: 'Nothing to add yet \u2014 add a bill or a job first.' }); return; }
  var file = new File([built.text], 'bills-and-paydays.ics', { type: 'text/calendar' });
  var done = function () { setUI({ icsMsg: built.count + ' dates ready \u2014 choose Calendar to add them.' }); };
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: 'Bills & paydays' }).then(done).catch(function () {});
    return;
  }
  var url = URL.createObjectURL(new Blob([built.text], { type: 'text/calendar' }));
  var a = document.createElement('a');
  a.href = url; a.download = 'bills-and-paydays.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  setUI({ icsMsg: built.count + ' dates downloaded \u2014 open the file to add them to Calendar.' });
}

/* ---------- compute view values ---------- */
function computeVals() {
  var d = D, S = UI;
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var tKey = dateKey(today);
  var mon = addDays(monday(today), S.weekOffset * 7);
  var wShifts = weekShifts(mon);
  var byJob = grossByJob(wShifts);
  var tot = deductWeek(byJob);
  var wHours = Object.keys(byJob).reduce(function (a, k) { return a + byJob[k].hours; }, 0);
  var thisMonthKey = mKey(today);
  var mn = monthNetFn(thisMonthKey);

  var maxDayH = Math.max(8, Math.max.apply(null, DOW.map(function (_, i) {
    var dk = dateKey(addDays(mon, i));
    return wShifts.filter(function (s) { return s.date === dk; }).reduce(function (a, s) { return a + shiftHoursFn(s); }, 0);
  })));
  var firstJobId = (d.jobs[0] || {}).id;
  var weekDays = DOW.map(function (dow, i) {
    var dk = dateKey(addDays(mon, i));
    var list = wShifts.filter(function (s) { return s.date === dk; });
    var h1 = list.filter(function (s) { return s.jobId === firstJobId; }).reduce(function (a, s) { return a + shiftHoursFn(s); }, 0);
    var h2 = list.filter(function (s) { return s.jobId !== firstJobId; }).reduce(function (a, s) { return a + shiftHoursFn(s); }, 0);
    var px = function (h) { return (h / maxDayH) * 58; };
    var tot2 = h1 + h2;
    return {
      dow: dow[0], h1: px(h1) + 'px', h2: px(h2) + 'px',
      hEmpty: tot2 > 0 ? '0px' : '4px',
      radius: h2 > 0 ? '0' : '5px 5px 0 0',
      labelColor: dk === tKey ? 'var(--accent, #F73F5C)' : 'var(--dim, #9AA0B2)'
    };
  });

  var dayRows = DOW.map(function (dow, i) {
    var dt = addDays(mon, i), dk = dateKey(dt);
    var list = wShifts.filter(function (s) { return s.date === dk; });
    return {
      dow: dow.toUpperCase(), dom: dt.getDate(),

          '<span style="font-family: \'Poppins\', sans-serif; font-size: 28px; font-weight: 600; letter-spacing: -.02em;">Set up your tracker</span>' +
          '<span style="font-size: 14px; color: var(--mut, #7A8095); line-height: 1.5;">Two minutes now, then you only ever log shifts. You can change any of this later.</span>' +
        '</div>' +
        '<label style="display: flex; flex-direction: column; gap: 7px;">' +
          '<span style="font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--mut2, #8A90A3); font-weight: 600;">Your first name</span>' +
          '<input type="text" placeholder="Sam" data-fid="su-name" value="' + esc(v.suName) + '" data-i="' + R(v.setSuName) + '" style="background: var(--card2, #F2F0F7); border: 1.5px solid var(--card3, #E4E1EC); border-radius: 13px; padding: 14px; color: var(--text, #1E2230); font-size: 16px;" />' +
        '</label>' +
        '<div style="background: var(--card, #FFFFFF); border-radius: 22px; box-shadow: var(--sh); padding: 16px; display: flex; flex-direction: column; gap: 12px;">' +
          '<span style="font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--mut2, #8A90A3); font-weight: 600;">First job</span>' +
          '<input type="text" placeholder="Where you work" data-fid="su-j1n" value="' + esc(v.suJ1n) + '" data-i="' + R(v.setSuJ1n) + '" style="background: var(--card2, #F2F0F7); border: 1.5px solid var(--card3, #E4E1EC); border-radius: 13px; padding: 13px; color: var(--text, #1E2230); font-size: 15px;" />' +
          '<div style="display: flex; background: var(--card2, #F2F0F7); border-radius: 999px; padding: 4px; gap: 4px;">' + suJ1PayHtml + '</div>' +
          '<div style="display: flex; gap: 10px;">' +
            '<label style="flex: 1; display: flex; flex-direction: column; gap: 6px;">' +
              '<span style="font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--mut2, #8A90A3); font-weight: 600;">' + esc(v.suJ1Label) + '</span>' +
              '<input type="number" inputmode="decimal" step="0.01" placeholder="12.60" data-fid="su-j1r" value="' + esc(v.suJ1r) + '" data-i="' + R(v.setSuJ1r) + '" style="background: var(--card2, #F2F0F7); border: 1.5px solid var(--card3, #E4E1EC); border-radius: 12px; padding: 11px; color: var(--text, #1E2230); font-size: 15px; width: 100%;" />' +
            '</label>' +
            '<label style="flex: 1; display: flex; flex-direction: column; gap: 6px;">' +
              '<span style="font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--mut2, #8A90A3); font-weight: 600;">Paid</span>' +
              '<select data-fid="su-j1c" data-i="' + R(v.setSuJ1c) + '" style="background: var(--card2, #F2F0F7); border: 1.5px solid var(--card3, #E4E1EC); border-radius: 12px; padding: 11px; color: var(--text, #1E2230); font-size: 15px; width: 100%;">' + j1CycleOpts + '</select>' +
            '</label>' +
          '</div>' +
        '</div>' +
        j2Block +
        '<button data-c="' + R(v.toggleSuJ2) + '" style="background: none; color: var(--accent, #F73F5C); font-size: 14px; font-weight: 600; text-align: left; padding: 2px 2px 6px;">' + esc(v.suJ2Label) + '</button>' +
        '<div style="background: var(--card, #FFFFFF); border-radius: 22px; box-shadow: var(--sh); padding: 16px; display: flex; flex-direction: column; gap: 12px;">' +
          '<div style="display: flex; flex-direction: column; gap: 3px;">' +
            '<span style="font-size: 15px; font-weight: 600;">Lock with a code (optional)</span>' +
            '<span style="font-size: 12px; color: var(--mut, #7A8095); line-height: 1.45;">4 digits, asked when you open the app. Kept on this phone.</span>' +
          '</div>' +
          '<div style="display: flex; gap: 10px;">' +
            '<input type="text" inputmode="numeric" placeholder="Code" data-fid="su-pin" value="' + esc(v.suPin) + '" data-i="' + R(v.setSuPin) + '" style="flex: 1; background: var(--card2, #F2F0F7); border: 1.5px solid var(--card3, #E4E1EC); border-radius: 12px; padding: 12px; color: var(--text, #1E2230); font-size: 16px; letter-spacing: .3em; width: 100%;" />' +
            '<input type="text" inputmode="numeric" placeholder="Again" data-fid="su-pin2" value="' + esc(v.suPin2) + '" data-i="' + R(v.setSuPin2) + '" style="flex: 1; background: var(--card2, #F2F0F7); border: 1.5px solid var(--card3, #E4E1EC); border-radius: 12px; padding: 12px; color: var(--text, #1E2230); font-size: 16px; letter-spacing: .3em; width: 100%;" />' +
          '</div>' +
        '</div>' +
        (v.hasSuError ? '<span style="font-size: 13px; color: var(--clay, #E8503A);">' + esc(v.suError) + '</span>' : '') +
        '<button data-c="' + R(v.finishSetup) + '" style="padding: 16px; border-radius: 999px; box-shadow: 0 8px 18px rgba(247,63,92,.26); background: var(--accent, #F73F5C); color: var(--onAccent, #FFFFFF); font-size: 16px; font-weight: 700;">Start tracking</button>' +
      '</div>' +
    '</div>';
}

function lockHTML(v) {
  var pinDotsHtml = v.pinDots.map(function (p) {
    return '<span style="width: 14px; height: 14px; border-radius: 999px; background: ' + p.bg + '; border: 1.5px solid ' + p.border + ';"></span>';
  }).join('');
  var pinKeysHtml = v.pinKeys.map(function (k) {
    return '<button data-c="' + R(k.tap) + '" style="height: 74px; border-radius: 999px; background: var(--card, #FFFFFF); color: var(--text, #1E2230); font-family: \'Poppins\', sans-serif; font-size: 24px; font-weight: 500; visibility: ' + k.shown + ';">' + esc(k.label) + '</button>';
  }).join('');
  return '' +
    '<div style="position: fixed; inset: 0; z-index: 70; background: var(--bg, #F4F2F7); max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 30px;">' +
      '<div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">' +
        '<span style="font-family: \'Poppins\', sans-serif; font-size: 24px; font-weight: 600;">' + esc(v.lockGreeting) + '</span>' +
        '<span style="font-size: 14px; color: var(--mut, #7A8095);">Enter your 4-digit code</span>' +
      '</div>' +
      '<div style="display: flex; gap: 14px;">' + pinDotsHtml + '</div>' +
      (v.hasSuError ? '<span style="font-size: 13px; color: var(--clay, #E8503A);">' + esc(v.suError) + '</span>' : '') +
      '<div style="display: grid; grid-template-columns: repeat(3, 74px); gap: 14px;">' + pinKeysHtml + '</div>' +
      '<button data-c="' + R(v.wipeTap) + '" style="background: none; color: ' + v.forgotColor + '; font-size: 13px; font-weight: 600; padding: 8px 14px; text-align: center; line-height: 1.4;">' + esc(v.forgotLabel) + '</button>' +
    '</div>';
}

function tabbarHTML(v) {
  var tabsHtml = v.tabs.map(function (t) {
    return '' +
      '<button data-c="' + R(t.go) + '" style="background: ' + t.bg + '; border-radius: 999px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0; color: ' + t.color + '; transition: background .16s ease;">' +
        '<span style="font-size: 19px; line-height: 1;">' + t.icon + '</span>' +
        '<span style="font-size: 10.5px; font-weight: 600; letter-spacing: .01em;">' + esc(t.label) + '</span>' +
      '</button>';
  }).join('');
  return '<div style="position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); left: 16px; right: 16px; z-index: 30; max-width: 408px; margin: 0 auto; background: var(--navy, #1E2230); border-radius: 999px; box-shadow: 0 14px 34px rgba(30,34,48,.26); display: grid; grid-template-columns: repeat(4, 1fr); padding: 7px;">' + tabsHtml + '</div>';
}

function appHTML(v) {
  return '' +
    '<div style="font-family: \'Poppins\', system-ui, sans-serif; background: var(--bg, #F4F2F7); color: var(--text, #1E2230); min-height: 100vh; max-width: 440px; margin: 0 auto; position: relative; overflow-x: hidden; padding-bottom: 116px;">' +
      headerHTML(v) +
      (v.isHome ? homeHTML(v) : '') +
      (v.isHours ? hoursHTML(v) : '') +
      (v.isExp ? expHTML(v) : '') +
      (v.isBills ? billsHTML(v) : '') +
      (v.sheetOpen ? sheetHTML(v) : '') +
      (v.isSetup ? setupHTML(v) : '') +
      (v.isLocked ? lockHTML(v) : '') +
      tabbarHTML(v) +
    '</div>';
}

/* ---------- mount / render / events ---------- */
var app = document.getElementById('app');

function captureFocus() {
  var el = document.activeElement;
  if (!el || !app.contains(el)) return null;
  var fid = el.getAttribute('data-fid');
  if (!fid) return null;
  var info = { fid: fid };
  if ('selectionStart' in el) { try { info.start = el.selectionStart; info.end = el.selectionEnd; } catch (e) {} }
  return info;
}
function restoreFocus(info) {
  if (!info) return;
  var el = app.querySelector('[data-fid="' + info.fid + '"]');
  if (!el) return;
  el.focus();
  if (info.start != null && el.setSelectionRange) { try { el.setSelectionRange(info.start, info.end); } catch (e) {} }
}

var _grab = false, _y0 = null;
function wireSheetTouch() {
  var sheetEl = app.querySelector('[data-sheet-drag]');
  var grabEl = app.querySelector('[data-grab-handle]');
  if (!sheetEl) return;
  if (grabEl) {
    grabEl.addEventListener('touchstart', function () { _grab = true; }, { passive: true });
  }
  sheetEl.addEventListener('touchstart', function (e) {
    _y0 = (_grab || sheetEl.scrollTop <= 0) ? e.touches[0].clientY : null;
    _grab = false;
  }, { passive: true });
  sheetEl.addEventListener('touchmove', function (e) {
    if (_y0 == null) return;
    var dy = e.touches[0].clientY - _y0;
    if (dy <= 0) { if (UI.drag) setUI({ drag: 0, dragging: true }); return; }
    if (e.cancelable) e.preventDefault();
    UI.drag = dy; UI.dragging = true;
    sheetEl.style.transform = 'translateY(' + dy + 'px)';
    sheetEl.style.transition = 'none';
  }, { passive: false });
  var onEnd = function () {
    var dy = UI.drag || 0;
    _y0 = null; _grab = false;
    if (dy > 100) setUI({ sheet: null, drag: 0, dragging: false });
    else setUI({ drag: 0, dragging: false });
  };
  sheetEl.addEventListener('touchend', onEnd);
  sheetEl.addEventListener('touchcancel', onEnd);
}

function render() {
  applyTheme();
  var v = computeVals();
  REG = {}; RC = 0;
  var focusInfo = captureFocus();
  app.innerHTML = appHTML(v);
  restoreFocus(focusInfo);
  wireSheetTouch();
}

app.addEventListener('click', function (e) {
  var t = e.target.closest('[data-c]');
  if (t) { var fn = REG[t.getAttribute('data-c')]; if (fn) fn(e); }
});
app.addEventListener('input', function (e) {
  var t = e.target.closest('[data-i]');
  if (t) { var fn = REG[t.getAttribute('data-i')]; if (fn) fn(e); }
});

render();
</script>
